[project]
name = "financials"
version = "0.1.0"
description = "Personal cashflow management: import, cleanup, visualize, forecast"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.0.0",
  "questionary>=2.0.0",
  "clevis>=0.7.0",
  "textual>=0.86.0",
  "textual-autocomplete>=4.0.6",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
financials = "financials.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financials"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
