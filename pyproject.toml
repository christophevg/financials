[project]
name = "financials"
version = "0.1.0"
description = "Personal cashflow management: import, cleanup, visualize, forecast"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.0.0",
  "questionary>=2.0.0",
  "clevis>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
financials = "financials.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financials"]

[tool.pytest.ini_options]
testpaths = ["tests"]
